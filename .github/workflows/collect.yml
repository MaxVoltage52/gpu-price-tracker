name: Collect GPU prices

on:
  schedule:
    # GitHub drops many scheduled runs when it is busy, so there are four chances an hour. The first
    # one to run collects; the others find this hour's snapshot already there and stop (--skip-if-fresh).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "collector/build.py"]   # redeploy on site changes without a new snapshot

permissions:
  contents: write   # commit the new snapshot
  pages: write
  id-token: write
  actions: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect snapshot
        run: python collector/collect.py ${{ github.event_name == 'schedule' && '--skip-if-fresh' || '' }}
        env:  # optional: sources whose docs ask for a (free) key are skipped or keyless without one
          SHADEFORM_API_KEY: ${{ secrets.SHADEFORM_API_KEY }}
          SPHERON_API_KEY: ${{ secrets.SPHERON_API_KEY }}

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:00Z)"
          git pull --rebase --quiet
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Publishing is its own job: if GitHub Pages stalls, only this job fails and the snapshot is already
  # saved; the next run publishes it.
  deploy:
    needs: collect
    if: always() && (needs.collect.outputs.changed == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # the branch head, including the snapshot just committed

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build site data
        run: python collector/build.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
